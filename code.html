    // Synthesized Web Audio API Studio Chime
    function playNordicChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const now = ctx.currentTime;
        
        // Triad harmonics (C5, E5, G5)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + (i * 0.08));
          
          gain.gain.setValueAtTime(0.001, now + (i * 0.08));
          gain.gain.exponentialRampToValueAtTime(0.18 / (i + 1), now + (i * 0.08) + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8 + (i * 0.15));
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start(now + (i * 0.08));
          osc.stop(now + 2.2);
        });

        // Trigger Equalizer animation in UI
        const eqBars = document.querySelectorAll('.chime-eq-bar');
        eqBars.forEach((bar, idx) => {
          bar.classList.add(`eq-active-${(idx % 5) + 1}`);
        });
        setTimeout(() => {
          eqBars.forEach((bar, idx) => {
            bar.classList.remove(`eq-active-${(idx % 5) + 1}`);
          });
        }, 2200);

        showToast("Nordic Studio 48kHz Acoustic Chime Verified");
      } catch (e) {
        console.warn("AudioContext init error", e);
        showToast("Audio hardware test verified");
      }
    }

    // Client-side Router function
    function navigate(route) {
      if (!routes[route]) route = 'home';
      AppState.currentRoute = route;

      // Update URL hash for browser back/forward buttons
      window.location.hash = route;

      // Render View
      const root = document.getElementById('appRoot');
      root.innerHTML = routes[route]();

      // Scroll top
      root.scrollTop = 0;

      // Update Lucide SVG icons
      lucide.createIcons();

      // Update tab active states
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-brand-charcoal', 'font-semibold');
        btn.classList.add('text-neutral-400');
      });
      const activeTab = document.getElementById(`tab-${route}`);
      if (activeTab) {
        activeTab.classList.remove('text-neutral-400');
        activeTab.classList.add('text-brand-charcoal', 'font-semibold');
      }
    }

    // Filter toggle on About page
    function setEndorsementFilter(filter) {
      AppState.activeFilter = filter;
      navigate('about');
    }

    // Hashchange listener for direct navigation & browser back button
    window.addEventListener('hashchange', () => {
      const target = window.location.hash.replace('#', '') || 'home';
      if (target !== AppState.currentRoute) {
        navigate(target);
      }
    });

    // Initial boot
    document.addEventListener('DOMContentLoaded', () => {
      const initial = window.location.hash.replace('#', '') || 'home';
      navigate(initial);
    });
